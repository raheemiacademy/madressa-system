# Render Blueprint for the hosted preview. Fictional seed data only — never load real records here.
# Deploys the `preview` branch; every push to it redeploys.
databases:
  - name: madressa-preview-db
    region: frankfurt
    plan: free # free Postgres expires after a trial period on Render; switch to a paid plan to keep it
    postgresMajorVersion: "16"
    databaseName: school_preview
    user: school_app
    ipAllowList: [] # reachable only from Render services, not the internet

services:
  - type: web
    name: madressa-preview
    runtime: docker # Chromium for server-side PDFs; the Dockerfile migrates, seeds and starts
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free # sleeps when idle; first visit after a break takes ~1 minute
    branch: preview
    healthCheckPath: /admin/login
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: madressa-preview-db, property: connectionString }
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true # backups are encrypted; on the free preview they live on the server's disk and go with each deploy
      - key: SEED_SAMPLE_DATA
        value: "1" # demo preview only: fictional sample school and logins
      - key: SEED_ADMIN_PASSWORD
        sync: false # you type this in Render when creating the blueprint
      - key: APP_URL
        value: https://madressa-preview.onrender.com # links in emails (set-password, messages)
      - key: TRUST_PROXY
        value: "1" # Render's proxy sets X-Forwarded-For
      - key: STORAGE_DRIVER
        value: local # uploads are lost on each deploy until real storage is added
      - key: EMAIL_DRIVER
        value: log
      - key: SMS_DRIVER
        value: log
