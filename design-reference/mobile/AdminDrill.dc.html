<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Fire drill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.app{font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app *{box-sizing:border-box}
.scroll{overscroll-behavior:contain}
.tap{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform 120ms cubic-bezier(0.23,1,0.32,1),background-color 120ms ease}
.tap:active{transform:scale(0.97)}
.hold{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold:focus-visible{outline:3px solid #84CEEB;outline-offset:3px}
a{color:inherit;text-decoration:none}
@media (prefers-reduced-motion:reduce){.tap:active{transform:none}}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; color: #fff; background: radial-gradient(90% 60% at 50% 0%, rgba(136,96,208,.45), transparent 70%), #1C2147">
  <header style="padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px 4px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" class="tap" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <span style="font-size: 17px; font-weight: 600">Fire drill</span>
  </header>

  <sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
    <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 28px calc(env(safe-area-inset-bottom, 0px) + 40px); text-align: center">
      <div>
        <h1 style="margin: 0 0 10px; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.2">Start a fire drill</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B9BEDB">Every class gets an instant roll call of who signed in today. Teachers are alerted on their phones.</p>
      </div>
      <button class="hold" aria-describedby="hold-hint" onPointerDown="{{down}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{keyDown}}" onKeyUp="{{keyUp}}" onContextMenu="{{noMenu}}" style="position: relative; width: 200px; height: 200px; border-radius: 50%; border: 0; padding: 0; overflow: hidden; cursor: pointer; background: #84CEEB; color: #1C2147; font: 600 18px Inter, system-ui, sans-serif">
        <span style="position: absolute; inset: 0; display: grid; place-items: center">Hold to start</span>
        <span aria-hidden="true" style="{{fillStyle}}">Keep holding…</span>
      </button>
      <p id="hold-hint" style="margin: 0; font-size: 14px; color: #B9BEDB">Press and hold for 2 seconds. Let go to cancel.</p>
    </main>
  </sc-if>

  <sc-if value="{{running}}" hint-placeholder-val="{{false}}">
    <main class="scroll" style="flex: 1; overflow-y: auto; padding: 8px 20px calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; gap: 14px">
      <div role="status" style="border-radius: 18px; padding: 16px; background: rgba(198,40,40,.22); border: 1px solid rgba(255,138,128,.45)">
        <div style="font-size: 13px; color: #FFD6D2">Drill running · started 19:42</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-size: 28px; margin-top: 2px">{{safeTotal}} of 214 safe</div>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12)">
        <sc-for list="{{classes}}" as="c" hint-placeholder-count="6">
          <li style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.08)">
            <span style="font-size: 15px; font-weight: 600">{{c.name}}</span>
            <button class="tap" onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="{{c.btn}}">{{c.btnLabel}}</button>
            <span style="font-size: 13px; color: #B9BEDB">{{c.meta}}</span>
          </li>
        </sc-for>
      </ul>
      <button class="tap" onClick="{{end}}" style="min-height: 52px; border-radius: 16px; border: 0; background: #fff; color: #1C2147; font: 600 16px Inter, system-ui, sans-serif; cursor: pointer">End drill and save report</button>
    </main>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { holding: false, running: false, safe: {} }; this.timer = null; }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    var self = this;
    var start = function () {
      if (self.state.holding || self.state.running) return;
      self.setState({ holding: true });
      self.timer = setTimeout(function () { self.setState({ holding: false, running: true }); }, 2000);
    };
    var stop = function () { clearTimeout(self.timer); if (self.state.holding) self.setState({ holding: false }); };
    var list = [['Maktab 1A', 28, 'Ustadha Hafsa Malik'], ['Maktab 1B', 30, 'Ustadha Zainab Iqbal'], ['Maktab 2A', 26, 'Ustadh Hamza Rafiq'], ['Maktab 2B', 29, 'Ustadha Khadija Noor'], ['Maktab 3A', 27, 'Ustadh Zakir Mahmood'], ['Maktab 3B', 25, 'Ustadha Maryam Ali'], ['Hifz A', 26, 'Ustadh Bilal Karim'], ['Alimiyyah', 23, 'Ustadh Idris Qureshi']];
    var total = 0;
    var classes = list.map(function (c) {
      var ok = !!self.state.safe[c[0]];
      if (ok) total += c[1];
      return {
        name: c[0], meta: c[1] + ' on register · ' + c[2], pressed: ok ? 'true' : 'false',
        btnLabel: ok ? 'All safe' : 'Mark safe',
        btn: 'min-height: 40px; padding: 0 14px; border-radius: 999px; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer; ' + (ok ? 'background: #84CEEB; color: #1C2147; border: 0' : 'background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35)'),
        toggle: function () { var s = Object.assign({}, self.state.safe); s[c[0]] = !ok; self.setState({ safe: s }); }
      };
    });
    var fill = 'position: absolute; inset: 0; display: grid; place-items: center; background: #8860D0; color: #fff; ' +
      (this.state.holding ? 'clip-path: inset(0 0 0 0); transition: clip-path 2s linear' : 'clip-path: inset(100% 0 0 0); transition: clip-path 200ms cubic-bezier(0.23,1,0.32,1)');
    return {
      idle: !this.state.running, running: this.state.running, classes: classes, safeTotal: total, fillStyle: fill,
      down: function (e) { if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); start(); },
      up: stop,
      keyDown: function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); start(); } },
      keyUp: function (e) { if (e.key === ' ' || e.key === 'Enter') stop(); },
      noMenu: function (e) { e.preventDefault(); },
      end: function () { self.setState({ running: false, safe: {} }); }
    };
  }
}
</script>
</body>
</html>
