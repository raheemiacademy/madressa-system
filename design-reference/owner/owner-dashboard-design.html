<title>Madressa Owner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0F4C4A">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A2725">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* Owner dashboard — the admin app's layout and components in a deep teal palette.
   Laptop: teal sidebar + full tables. Phone: cards + bottom tab bar. */
:root {
  --bg: #F6F4EF; --panel: #FFFFFF; --panel-2: #EFECE4; --border: #E2DED4; --hair: #EEEBE3;
  --fg: #1B2A29; --muted: #5B6866;
  --side: #0F4C4A; --side-2: #0C3F3D; --side-fg: #FFFFFF; --side-muted: #B9D3D0;
  --action: #13807A; --action-hover: #0E6B66; --on-action: #FFFFFF; --link: #0E6B66;
  --amber: #E0A526; --amber-text: #8A5A00; --amber-tint: #FBF1DA;
  --bad: #B42318; --bad-tint: #FCE9E6; --ok: #1F7A4A; --ok-tint: #E3F2EA;
  --chart: #13807A; --chart-fill: rgba(19,128,122,.12); --grid: #ECE8DF; --ref: #B8B2A4;
  --scrim: rgba(11,31,30,.45); --shadow-pop: 0 12px 40px rgba(11,31,30,.18);
  --display: 'Fraunces', Georgia, serif; --text: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 12px; --r-lg: 16px; --ctl: 40px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1F1E; --panel: #12302E; --panel-2: #183B39; --border: #24504D; --hair: #1D4441;
  --fg: #E8F1EF; --muted: #9DB3B0;
  --side: #0A2725; --side-2: #0D302E; --side-fg: #FFFFFF; --side-muted: #A9C6C2;
  --action: #2BB3A8; --action-hover: #4CC7BD; --on-action: #0B1F1E; --link: #5FD0C6;
  --amber: #E0A526; --amber-text: #E8B84A; --amber-tint: #3A2F12;
  --bad: #F08A7E; --bad-tint: #3D1E1B; --ok: #6FCF97; --ok-tint: #143726;
  --chart: #2BB3A8; --chart-fill: rgba(43,179,168,.16); --grid: #1D4441; --ref: #4F7470;
  --scrim: rgba(0,0,0,.55); --shadow-pop: 0 12px 40px rgba(0,0,0,.45);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0B1F1E; --panel: #12302E; --panel-2: #183B39; --border: #24504D; --hair: #1D4441;
  --fg: #E8F1EF; --muted: #9DB3B0;
  --side: #0A2725; --side-2: #0D302E; --side-fg: #FFFFFF; --side-muted: #A9C6C2;
  --action: #2BB3A8; --action-hover: #4CC7BD; --on-action: #0B1F1E; --link: #5FD0C6;
  --amber: #E0A526; --amber-text: #E8B84A; --amber-tint: #3A2F12;
  --bad: #F08A7E; --bad-tint: #3D1E1B; --ok: #6FCF97; --ok-tint: #143726;
  --chart: #2BB3A8; --chart-fill: rgba(43,179,168,.16); --grid: #1D4441; --ref: #4F7470;
  --scrim: rgba(0,0,0,.55); --shadow-pop: 0 12px 40px rgba(0,0,0,.45);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--text); font-variant-numeric: tabular-nums; }
a { color: var(--link); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 6px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--display); font-weight: 400; letter-spacing: -0.01em; }

/* Shell */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 12px; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: #2BB3A8; display: grid; place-items: center; flex: none; }
.brand-name { font-family: var(--display); font-size: 1.125rem; line-height: 1.1; }
.owner-pill { margin-left: auto; font-size: 12px; font-weight: 600; color: #0B1F1E; background: #E0A526; border-radius: 999px; padding: 3px 9px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; min-height: var(--ctl); padding: 0 12px; border-radius: 10px; color: var(--side-muted); text-decoration: none; font-weight: 500; position: relative; transition: background-color .15s ease, color .15s ease; }
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav a[aria-current="page"] { background: rgba(255,255,255,.1); color: var(--side-fg); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: #2BB3A8; }
.nav .count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: #E0A526; color: #0B1F1E; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
@media (hover: hover) and (pointer: fine) { .nav a:hover { color: var(--side-fg); background: rgba(255,255,255,.06); } }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: var(--side-muted); }
.side-foot label { display: flex; flex-direction: column; gap: 6px; }
.side-foot select { min-height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: var(--side-2); color: var(--side-fg); padding: 0 8px; font-size: 13px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 18px 32px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
.top h1 { margin: 0; font: 400 1.625rem/1.15 var(--display); letter-spacing: -0.01em; margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
.top .crumb { display: block; font: 500 13px/1.3 var(--text); color: var(--muted); margin-bottom: 2px; }
.top .crumb a { color: var(--muted); }
.checked { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.top-account { display: none; }
.view { padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* Mobile tabs */
.tabs { display: none; }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .top { padding: calc(14px) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .top h1 { font-size: 1.375rem; }
  .top .checked { display: none; }
  .top-account { display: grid; }
  .view { padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 16px; }
  .tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel); border-top: 1px solid var(--border); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tabs a { flex: 1; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--muted); text-decoration: none; position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .tabs a svg { width: 22px; height: 22px; }
  .tabs a[aria-current="page"] { color: var(--link); }
  .tabs .count { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--amber); color: #0B1F1E; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
}

/* Building blocks */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--ctl); padding: 0 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; user-select: none; -webkit-user-select: none; transition: background-color .15s ease, border-color .15s ease, transform 160ms var(--ease-out); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--action); border-color: transparent; color: var(--on-action); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--action); }
  .btn.primary:hover { background: var(--action-hover); }
}
.icon-btn { width: var(--ctl); height: var(--ctl); padding: 0; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { margin: 0; font-size: 16px; font-weight: 600; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 1180px) { .c3 { grid-column: span 6; } .c4, .c5, .c7, .c8 { grid-column: span 12; } }
@media (max-width: 760px) { .c3, .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } }

.strip { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--r-lg); text-decoration: none; color: var(--fg); border: 1px solid transparent; }
.strip .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.strip b { font-weight: 600; }
.strip .go { margin-left: auto; font-weight: 600; color: var(--link); white-space: nowrap; font-size: 14px; }
.strip.ok { background: var(--ok-tint); } .strip.ok .dot { background: var(--ok); }
.strip.warn { background: var(--amber-tint); border-color: color-mix(in srgb, var(--amber) 45%, transparent); } .strip.warn .dot { background: var(--amber); }
.strip.bad { background: var(--bad-tint); border-color: color-mix(in srgb, var(--bad) 40%, transparent); } .strip.bad .dot { background: var(--bad); }
.strip-text { min-width: 0; overflow-wrap: anywhere; }

.tile { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--fg); min-width: 0; transition: border-color .15s ease, transform 160ms var(--ease-out); }
a.tile:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { a.tile:hover { border-color: var(--action); } }
.tile .label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.tile .big { font: 400 2rem/1.1 var(--display); letter-spacing: -0.01em; }
.tile .big small { font: 500 15px var(--text); color: var(--muted); letter-spacing: 0; }
.tile .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.meter { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--chart); }
.meter.warn i { background: var(--amber); } .meter.bad i { background: var(--bad); }
.meter-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.meter-row span:last-child { text-align: right; }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.status.warn::before { background: var(--amber); } .status.bad::before { background: var(--bad); } .status.off::before { background: var(--muted); }
.status.warn { color: var(--amber-text); } .status.bad { color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--panel-2); color: var(--fg); }
.chip.new { background: var(--amber-tint); color: var(--amber-text); }
.chip.contacted { background: color-mix(in srgb, var(--chart) 16%, transparent); color: var(--link); }
.chip.setup { background: var(--ok-tint); color: var(--ok); }
.chip.no { background: var(--panel-2); color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--hair); }
.list li:first-child { border-top: 0; }
.need { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; text-decoration: none; color: var(--fg); }
.need .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
.need .dot.warn { background: var(--amber); } .need .dot.bad { background: var(--bad); } .need .dot.info { background: var(--chart); }
.need b { font-weight: 600; }
.need span { overflow-wrap: anywhere; }
.need time { font-size: 13px; color: var(--muted); white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { a.need:hover b, a.need:hover span { text-decoration: underline; } }

.week { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 0; }
.week > div { padding: 4px 18px; border-left: 1px solid var(--hair); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.week > div:nth-child(odd) { border-left: 0; padding-left: 0; }
.week .label { font-size: 13px; color: var(--muted); }
.week .big { font: 400 1.75rem/1.1 var(--display); }
.delta { font-size: 13px; font-weight: 500; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
.grid > div > .tile { height: 100%; }

/* Tables (laptop) and cards (phone) */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.t td { padding: 12px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; }
.t .name { font-weight: 600; color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
.t .addr { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.t .muted { color: var(--muted); }
.t tbody tr { cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .t tbody tr:hover td { background: color-mix(in srgb, var(--chart) 6%, transparent); } .t tbody tr:hover .name { text-decoration: underline; } }
.fees { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
.fees .meter { height: 5px; }
.mcards { display: none; }
@media (max-width: 760px) { .tbl-or-cards .table-wrap { display: none; } .tbl-or-cards .mcards { display: flex; flex-direction: column; gap: 10px; } }
.mcard { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--fg); transition: transform 160ms var(--ease-out); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.mcard:active { transform: scale(0.98); }
.mcard-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.mcard-h b { font-size: 16px; overflow-wrap: anywhere; }
.mcard .addr { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.facts div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.facts small { display: block; font-size: 12px; color: var(--muted); }
.facts strong { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }

.seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--panel-2); border-radius: 12px; flex-wrap: wrap; }
.seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--border); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .grow { flex: 1 1 220px; }
.input, .select, .textarea { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 0 12px; font-size: 15px; }
.textarea { padding: 10px 12px; min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: 2px solid var(--action); outline-offset: 0; border-color: var(--action); }
@media (pointer: coarse) { .input, .select, .textarea { font-size: 16px; } :root { --ctl: 44px; } .btn.sm { min-height: 40px; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 14px; font-weight: 500; }
.field .hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }
.empty b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px; }
code, .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.cmd { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.cmd code { flex: 1; white-space: nowrap; }

/* Detail */
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kv div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kv small { display: block; font-size: 12px; color: var(--muted); }
.kv strong { display: block; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.kv strong.num { font-weight: 400; font-size: 1.375rem; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 72px; gap: 10px; align-items: center; font-size: 14px; }
.bar-row span:last-child { text-align: right; white-space: nowrap; }
.kv4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kv2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1180px) { .kv4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bar-row .meter { height: 8px; }
.trends { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .trends { grid-template-columns: minmax(0, 1fr); } }
.trend h4 { margin: 0 0 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
.money { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.money h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
@media (max-width: 560px) { .money { grid-template-columns: minmax(0, 1fr); } }
.contacts { display: flex; flex-direction: column; gap: 10px; }
.contact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--hair); }
.contact:first-child { border-top: 0; }
.contact b { display: block; overflow-wrap: anywhere; }
.contact small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; user-select: text; }
.contact .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.action { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--panel-2); }
.action b { display: block; font-weight: 600; }
.action small { color: var(--muted); font-size: 13px; }
@media (max-width: 480px) { .action { grid-template-columns: minmax(0, 1fr); } .contact { grid-template-columns: minmax(0, 1fr); } .contact .acts { justify-content: flex-start; } }

/* Leads */
.leads { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .leads { grid-template-columns: minmax(0, 1fr); } .leads .lead-detail-wrap { display: none; } }
.lead-list { padding: 6px; gap: 0; }

  var list = L.length ? L.map(function (l) { return '<a class="lead-item" href="#lead-' + esc(l.id) + '"' + (sel && sel.id === l.id ? ' aria-current="true"' : '') + '><b>' + esc(l.school || l.name) + '</b><time>' + esc(l.when) + '</time><span class="meta">' + esc(l.kind) + ' · ' + esc(l.name) + '</span><span class="chip ' + chipCls[l.status] + '">' + esc(l.status) + '</span></a>'; }).join('') : '<div class="empty">No leads with this status.</div>';
  var detail = sel ? leadDetail(sel) : '';
  if (id && window.innerWidth <= 960) return '<a class="btn sm" href="#leads" style="align-self:flex-start">' + ic('back') + 'All leads</a>' + detail;
  return '<div class="toolbar">' + seg + '</div><div class="leads"><section class="card lead-list" aria-label="Leads">' + list + '</section><div class="lead-detail-wrap">' + detail + '</div></div>';
};
var slugify = function (s) { return (s || 'new-madrasah').toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').trim().split(/\s+/).slice(0, 2).join('-').replace(/_/g, '-') || 'new-madrasah'; };
var leadDetail = function (l) {
  var rows = [['Type', l.kind], ['School', l.school || '—'], ['Name', l.name], ['Role', l.role], ['Email', l.email], ['Phone', l.phone ? '+' + l.phone : ''], ['Students', l.students ? n(l.students) : ''], ['Kind of school', l.type], ['Topic', l.topic], ['Received', l.when]].filter(function (r) { return r[1]; });
  return '<section class="card lead-detail" aria-labelledby="h-lead"><div class="card-h"><h2 id="h-lead" style="overflow-wrap:anywhere">' + esc(l.school || l.name) + '</h2>' +
    '<label class="vh" for="lead-status">Status</label><select class="select" id="lead-status" data-id="' + esc(l.id) + '" style="width:auto;min-width:160px">' + ['New', 'Contacted', 'Set up', 'Not interested'].map(function (s) { return '<option' + (l.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
    '<dl>' + rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' +
    (l.message ? '<div class="msg">' + esc(l.message) + '</div>' : '') +
    '<div class="btn-row"><a class="btn primary" href="mailto:' + esc(l.email) + '?subject=' + encodeURIComponent('Madressa System') + '">' + ic('mail') + 'Reply by email</a>' +
    (l.phone ? '<a class="btn" href="https://wa.me/' + esc(l.phone) + '" target="_blank" rel="noopener">' + ic('wa') + 'WhatsApp</a>' : '<button class="btn" disabled title="No phone number given">' + ic('wa') + 'WhatsApp</button>') +
    '<button class="btn" data-act="setup" data-id="' + esc(l.id) + '">Set up as a madrasah</button></div>' +
    '<label class="field"><span>Notes</span><textarea class="textarea" id="lead-notes" data-id="' + esc(l.id) + '" placeholder="For example, called on Tuesday, wants a demo…">' + esc(l.notes) + '</textarea></label></section>';
};

var vServer = function () {
  var S = D.server, M = D.madrasahs;
  var days = ['Tue', '', 'Wed', '', 'Thu', '', 'Fri', '', 'Sat', '', 'Sun', '', 'Mon', 'Now'];
  var metric = function (k, title, now, text, series, ref) { return '<section class="card c4" aria-labelledby="h-' + k + '"><div class="card-h"><h2 id="h-' + k + '">' + title + '</h2><span class="' + (ref && now >= ref ? 'status bad' : 'status') + '">' + now + '% now</span></div><p class="note">' + esc(text) + '</p>' + chart('s-' + k, series, { h: 140, axis: true, max: 100, ref: ref, unit: '%', labels: days.map(function (d, i) { return d || ('Day ' + (i + 1)); }), aria: title + ' over 7 days: ' + series.join(', ') + ' percent' }) + '</section>'; };
  var cont = '<table class="t"><thead><tr><th scope="col">Container</th><th scope="col">State</th><th scope="col">Up for</th><th scope="col" class="r">Memory</th></tr></thead><tbody>' + S.containers.map(function (c) { return '<tr style="cursor:default"><td><code>' + esc(c[0]) + '</code></td><td><span class="status ' + (c[1] === 'Running' ? '' : 'bad') + '">' + esc(c[1]) + '</span></td><td>' + esc(c[2]) + '</td><td class="r">' + esc(c[3]) + '</td></tr>'; }).join('') + '</tbody></table>';
  var bk = M.length ? '<table class="t"><thead><tr><th scope="col">Madrasah</th><th scope="col">Last night</th><th scope="col">Newest</th><th scope="col" class="r">Size</th></tr></thead><tbody>' + M.map(function (m) { return '<tr data-href="#madrasah-' + esc(m.slug) + '"><td><a class="name" href="#madrasah-' + esc(m.slug) + '">' + esc(m.name) + '</a></td><td>' + (m.backupOk ? '<span class="status">Ran</span>' : '<span class="status bad">Didn’t run</span>') + '</td><td>' + esc(m.backupWhen) + ' <span class="addr">' + n(m.backupAgeH) + ' hours old</span></td><td class="r">' + esc(m.backupSize) + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">No madrasahs to back up yet.</div>';
  return '<div class="grid">' + metric('disk', 'Disk', S.disk, S.diskText + ' used', S.diskSeries, 85) + metric('mem', 'Memory', S.mem, S.memText + ' used', S.memSeries, 90) + metric('cpu', 'CPU', S.cpu, 'Average across cores', S.cpuSeries, 0) + '</div>' +
    '<div class="grid"><section class="card c6" aria-labelledby="h-cont"><div class="card-h"><h2 id="h-cont">Containers</h2><p class="note">' + n(S.containers.length) + ' total</p></div><div class="table-wrap">' + cont + '</div></section>' +
    '<section class="card c6" aria-labelledby="h-bk"><div class="card-h"><h2 id="h-bk">Backups</h2><p class="note">Nightly at 02:00</p></div><div class="table-wrap">' + bk + '</div><p class="note">Off-server copies: not set up yet.</p></section></div>' +
    '<section class="card" aria-labelledby="h-ver"><div class="card-h"><h2 id="h-ver">Version</h2></div><div class="kv"><div><small>Deployed</small><strong>' + esc(S.version) + '</strong></div><div><small>When</small><strong>' + esc(S.deployed) + '</strong></div><div><small>Madrasahs on it</small><strong>' + n(M.filter(function (m) { return m.version === S.version; }).length) + ' of ' + n(M.length) + '</strong></div></div></section>';
};

var vAlerts = function () {
  var A = D.alerts;
  var on = JSON.parse(store.get('alertsOn', 'null') || 'null') || { down: 1, back: 1, backup: 1, server: 1, signup: 1, contact: 1 };
  var push = store.get('push', '0') === '1';
  var types = [['down', 'A madrasah stops responding', 'After 2 checks in a row, about 10 minutes'], ['back', 'It comes back', ''], ['backup', 'A backup fails or is over 26 hours old', ''], ['server', 'Disk over 85% or memory over 90%', ''], ['signup', 'New early-access sign-up', ''], ['contact', 'New contact message', '']];
  var hist = A.length ? '<div class="table-wrap"><table class="t"><thead><tr><th scope="col">Alert</th><th scope="col">About</th><th scope="col">Sent</th><th scope="col">Cleared</th><th scope="col">Sent by</th></tr></thead><tbody>' + A.slice(0, 50).map(function (a) { return '<tr style="cursor:default"><td>' + esc(a.what) + '</td><td style="overflow-wrap:anywhere;max-width:240px">' + esc(a.who) + '</td><td>' + esc(a.sent) + '</td><td>' + (a.cleared ? esc(a.cleared) : '<span class="status warn">Still open</span>') + '</td><td>' + esc(a.ch) + '</td></tr>'; }).join('') + '</tbody></table></div>' + (A.length > 50 ? '<p class="note">Showing the newest 50 of ' + n(A.length) + '.</p>' : '')
    : '<div class="empty"><b>No alerts yet</b>When something goes wrong or a lead arrives, it’s listed here with when it cleared.</div>';
  return '<div class="grid"><section class="card c8" aria-labelledby="h-hist"><div class="card-h"><h2 id="h-hist">History</h2><p class="note">One alert per problem until it clears</p></div>' + hist + '</section>' +
    '<section class="card c4" aria-labelledby="h-set"><div class="card-h"><h2 id="h-set">Settings</h2></div>' +
      '<div class="opt"><span><b>Push on this device</b><small>' + (push ? 'On for this browser' : 'Off for this browser') + '</small></span><button class="btn sm' + (push ? '' : ' primary') + '" data-act="push">' + (push ? 'Turn off' : 'Turn on') + '</button></div>' +
      '<fieldset style="border:0;margin:0;padding:0"><legend class="note" style="margin:8px 0 2px">Send me alerts when</legend>' + types.map(function (t) { return '<label class="opt"><span>' + t[1] + (t[2] ? '<small>' + t[2] + '</small>' : '') + '</span><input class="switch" type="checkbox" role="switch" data-alert="' + t[0] + '"' + (on[t[0]] ? ' checked' : '') + '></label>'; }).join('') + '</fieldset>' +
      '<label class="field"><span>Alert email</span><input class="input" type="email" id="alert-email" autocomplete="email" autocapitalize="none" spellcheck="false" value="' + esc(store.get('alertEmail', '')) + '" placeholder="you@example.org"></label>' +
      '<p class="note" style="color:var(--amber-text)">Email isn’t connected to a sending service yet, so alerts only reach you by push for now.</p></section></div>';
};

var vAccount = function () {
  return '<div class="grid"><section class="card c6" aria-labelledby="h-pw"><div class="card-h"><h2 id="h-pw">Change password</h2></div>' +
    '<label class="field"><span>Current password</span><input class="input" type="password" id="pw-cur" autocomplete="current-password"></label>' +
    '<label class="field"><span>New password <span class="hint">at least 12 characters</span></span><input class="input" type="password" id="pw-new" autocomplete="new-password" minlength="12"></label>' +
    '<label class="field"><span>Repeat new password</span><input class="input" type="password" id="pw-rep" autocomplete="new-password"></label>' +
    '<p class="err" id="pw-err" aria-live="polite"></p><button class="btn primary" data-act="pw" style="align-self:flex-start">Change password</button></section>' +
    '<section class="card c6" aria-labelledby="h-sec"><div class="card-h"><h2 id="h-sec">Security</h2></div><div class="actions">' +
      '<div class="action"><div><b>Reset the authenticator</b><small>You’ll set up a new 6-digit code on your phone.</small></div><button class="btn" data-act="totp">Reset</button></div>' +
      '<div class="action"><div><b>Sign out everywhere</b><small>Every other device has to sign in again.</small></div><button class="btn danger" data-act="signout">Sign out</button></div></div>' +
      '<h3 style="margin:8px 0 0;font-size:14px">Where you’re signed in</h3><ul class="list">' + D.sessions.map(function (s) { return '<li class="opt"><span><b>' + esc(s[0]) + '</b><small>' + esc(s[1]) + '</small></span><span class="note">' + esc(s[2]) + '</span></li>'; }).join('') + '</ul></section>' +
    '<section class="card c12" aria-labelledby="h-more"><div class="card-h"><h2 id="h-more">Server</h2><a href="#server">Open server page</a></div><p class="note">Disk ' + D.server.disk + '% · memory ' + D.server.mem + '% · version ' + esc(D.server.version) + '. Server and Account are in this menu on a phone.</p></section></div>';
};

var vSignin = function (step) {
  return '<div class="signin"><div class="signin-card"><div class="brand" style="padding:0"><span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6"/><path d="M5 10v9h14v-9"/></svg></span><span class="brand-name" translate="no">Madressa</span><span class="owner-pill">Owner</span></div>' +
    (step === 2
      ? '<h1>Enter your code</h1><p class="note">Open your authenticator app and type the 6-digit code for Madressa Owner.</p><label class="field"><span>6-digit code</span><input class="input otp" id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" enterkeyhint="go"></label><p class="err" id="si-err" aria-live="polite"></p><button class="btn primary" data-act="otp">Sign in</button><a href="#signin">Back</a>'
      : '<h1>Owner sign-in</h1><p class="note">Only the owner account can sign in here. There is no sign-up.</p><label class="field"><span>Email</span><input class="input" id="si-email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next"></label><label class="field"><span>Password</span><input class="input" id="si-pw" type="password" autocomplete="current-password" enterkeyhint="go"></label><p class="err" id="si-err" aria-live="polite"></p><button class="btn primary" data-act="si">Continue</button>') +
    '<p class="note">Prototype: any values work. <a href="#overview">Skip to the dashboard</a></p></div></div>';
};

/* ---------- router ---------- */
var firstView = true;
var route = function () {
  var h = (location.hash || '#overview').slice(1);
  var app = document.getElementById('app');
  if (h === 'signin' || h === 'signin-code') { app.innerHTML = vSignin(h === 'signin-code' ? 2 : 1); var f = app.querySelector('input'); if (f && !firstView) f.focus(); firstView = false; return; }
  var title, crumb = '', body;
  if (h.indexOf('madrasah-') === 0) {
    var m = D.madrasahs.filter(function (x) { return 'madrasah-' + x.slug === h; })[0];
    body = m ? vMadrasah(m.slug) : null;
    title = m ? m.name : 'Madrasah not found'; crumb = '<a href="#madrasahs">Madrasahs</a>' + (m ? ' · ' + esc(hostOf(m)) : '');
    if (!body) body = '<div class="card"><div class="empty"><b>Not found</b>It may have been removed. <a href="#madrasahs">Back to madrasahs</a></div></div>';
  } else if (h.indexOf('lead-') === 0) { title = 'Leads'; body = vLeads(h.slice(5)); }
  else if (h === 'madrasahs') { title = 'Madrasahs'; body = vMadrasahs(); }
  else if (h === 'leads') { title = 'Leads'; body = vLeads(); }
  else if (h === 'server') { title = 'Server'; body = vServer(); }
  else if (h === 'alerts') { title = 'Alerts'; body = vAlerts(); }
  else if (h === 'account') { title = 'Account'; body = vAccount(); }
  else { h = 'overview'; title = 'Overview'; body = vOverview(); }
  app.innerHTML = shell(h, title, crumb, body);
  firstView = false;
  drawCharts();
  window.scrollTo(0, 0);
};
window.addEventListener('hashchange', route);

/* ---------- sheet + toast ---------- */
var layer = document.getElementById('layer'), lastFocus = null;
var sheet = function (title, html, confirmLabel, onConfirm, danger) {
  lastFocus = document.activeElement;
  layer.innerHTML = '<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t">' + esc(title) + '</h2>' + html + '<div class="btn-row"><button class="btn" data-close>Cancel</button>' + (confirmLabel ? '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-ok>' + esc(confirmLabel) + '</button>' : '') + '</div></div></div>';
  var s = layer.querySelector('.sheet'); (s.querySelector('[data-ok]') || s.querySelector('[data-close]')).focus();
  layer.onclick = function (e) {
    if (e.target.classList.contains('scrim') || e.target.closest('.btn[data-close]')) close();
    else if (e.target.closest('[data-ok]')) { var r = onConfirm && onConfirm(s); if (r !== false) close(); }
    else if (e.target.closest('[data-copy]')) copy(e.target.closest('[data-copy]'));
  };
};
var close = function () { layer.innerHTML = ''; layer.onclick = null; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); };
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && layer.innerHTML) close();
  if (e.key === 'Tab' && layer.innerHTML) { var f = layer.querySelectorAll('button, [href], input, select, textarea'); if (!f.length) return; var a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
});
var toastT;
var toast = function (msg) {
  var old = document.querySelector('.toast'); if (old) old.remove();
  var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 180); }, 3600);
};
var copy = function (btn) {
  var text = btn.getAttribute('data-copy');
  var done = function () { var o = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = o; }, 1500); };
  try { navigator.clipboard.writeText(text).then(done, function () { selectText(btn); }); } catch (e) { selectText(btn); }
};
var selectText = function (btn) { var c = btn.parentElement.querySelector('code'); if (!c) return; var r = document.createRange(); r.selectNodeContents(c); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl+C or Cmd+C to copy'); };

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var row = e.target.closest('tr[data-href]'); if (row && !e.target.closest('a,button')) { location.hash = row.getAttribute('data-href'); return; }
  var s = e.target.closest('[data-sort]'); if (s) { sortMode = s.getAttribute('data-sort'); route(); return; }
  var lf = e.target.closest('[data-lf]'); if (lf) { leadFilter = lf.getAttribute('data-lf'); route(); return; }
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), m = D.madrasahs.filter(function (x) { return x.slug === b.getAttribute('data-slug'); })[0];
  if (act === 'refresh') { toast('Checking every madrasah now…'); return; }
  if (act === 'restart') sheet('Restart ' + m.name + '?', '<p>It will be unavailable for about 30 seconds. The server picks this up within a minute. It’s recorded in the audit log.</p>', 'Restart', function () { toast('Restart queued for ' + m.name + '.'); });
  if (act === 'backup') sheet('Back up ' + m.name + ' now?', '<p>A backup starts within a minute. You’ll see it on the Server page when it’s done. It’s recorded in the audit log.</p>', 'Back up now', function () { toast('Backup queued for ' + m.name + '.'); });
  if (act === 'link') sheet('Set-password link for…', '<label class="field"><span>Admin</span><select class="select" id="link-admin">' + m.admins.map(function (a, i) { return '<option value="' + i + '">' + esc(a.name) + ' · ' + esc(a.email) + '</option>'; }).join('') + '</select></label><p class="note">The link is made by ' + esc(m.name) + ' itself and logged in its audit log and yours. Send it to the admin privately.</p>', 'Make link', function (sh) {
    var a = m.admins[Number(sh.querySelector('#link-admin').value)];
    var link = 'https://' + hostOf(m) + '/set-password/3f9c2a7e81d4b6c0';
    sh.innerHTML = '<h2 id="sh-t">Link for ' + esc(a.name) + '</h2><p class="note">Copy it and send it to them privately, for example on WhatsApp.</p><div class="cmd"><code>' + esc(link) + '</code><button class="btn sm" data-copy="' + esc(link) + '">' + ic('copy') + 'Copy</button></div><div class="btn-row"><button class="btn primary" data-close>Done</button></div>';
    sh.querySelector('[data-copy]').focus();
    return false;
  });
  if (act === 'setup') { var l = D.leads.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; var cmd = './madrasah add ' + slugify(l.school || l.name); sheet('Set up ' + (l.school || l.name), '<p>Run this on the server. Nothing is created from the website.</p><div class="cmd"><code>' + esc(cmd) + '</code><button class="btn sm" data-copy="' + esc(cmd) + '">' + ic('copy') + 'Copy</button></div><p class="note">When it’s running, set this lead to “Set up”.</p>', null); }
  if (act === 'push') { var on = store.get('push', '0') === '1'; store.set('push', on ? '0' : '1'); route(); toast(on ? 'Push turned off for this browser.' : 'Push turned on for this browser.'); }
  if (act === 'totp') sheet('Reset the authenticator?', '<p>Your current 6-digit codes stop working. You’ll get a new key to add to your authenticator app straight away.</p>', 'Reset', function () { toast('New authenticator key ready.'); }, true);
  if (act === 'signout') sheet('Sign out everywhere?', '<p>Every device, including this one, has to sign in again with your password and code.</p>', 'Sign out everywhere', function () { location.hash = '#signin'; }, true);
  if (act === 'pw') { var cur = document.getElementById('pw-cur').value, nw = document.getElementById('pw-new').value, rp = document.getElementById('pw-rep').value, err = document.getElementById('pw-err');
    err.textContent = !cur ? 'Enter your current password.' : nw.length < 12 ? 'Use at least 12 characters for the new password.' : nw !== rp ? 'The two new passwords don’t match.' : '';
    if (!err.textContent) { toast('Password changed. Other devices are signed out.'); ['pw-cur', 'pw-new', 'pw-rep'].forEach(function (id) { document.getElementById(id).value = ''; }); } }
  if (act === 'si') { var em = document.getElementById('si-email').value, pw = document.getElementById('si-pw').value, se = document.getElementById('si-err'); se.textContent = !em || !pw ? 'Enter your email and password.' : ''; if (!se.textContent) location.hash = '#signin-code'; }
  if (act === 'otp') { var c = document.getElementById('otp').value.trim(), oe = document.getElementById('si-err'); oe.textContent = /^\d{6}$/.test(c) ? '' : 'Enter the 6 digits from your authenticator app.'; if (!oe.textContent) location.hash = '#overview'; }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'data-mode') { store.set('data', t.value); location.reload(); }
  if (t.id === 'lead-status') { var l = D.leads.filter(function (x) { return x.id === t.dataset.id; })[0]; l.status = t.value; leadState[l.id] = { status: l.status, notes: l.notes }; store.set('leads', JSON.stringify(leadState)); route(); toast('Status set to ' + t.value + '.'); }
  if (t.dataset.alert) { var on = JSON.parse(store.get('alertsOn', 'null') || 'null') || { down: 1, back: 1, backup: 1, server: 1, signup: 1, contact: 1 }; on[t.dataset.alert] = t.checked ? 1 : 0; store.set('alertsOn', JSON.stringify(on)); }
  if (t.id === 'alert-email') store.set('alertEmail', t.value);
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'notes') { store.set('notes.' + t.dataset.slug, t.value); var st = document.getElementById('notes-state'); if (st) st.textContent = 'Saved on this device'; }
  if (t.id === 'lead-notes') { var l = D.leads.filter(function (x) { return x.id === t.dataset.id; })[0]; l.notes = t.value; leadState[l.id] = { status: l.status, notes: l.notes }; store.set('leads', JSON.stringify(leadState)); }
  if (t.id === 'otp') t.value = t.value.replace(/\D/g, '').slice(0, 6);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.target.id === 'si-pw' || e.target.id === 'otp')) { e.preventDefault(); document.querySelector('[data-act="' + (e.target.id === 'otp' ? 'otp' : 'si') + '"]').click(); } });

route();
})();
</script>
