# Shared parts on the VPS: one Postgres for every madrasah (a database and user each), Caddy for HTTPS, and the home page.
# The madrasah apps themselves are started by ./madrasah (one container each) on the same network.
name: madrasah
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./secrets/pg_password:/run/secrets/pg_password:ro
    networks: [apps] # not published: only the app containers can reach it
    shm_size: 256mb
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [apps]
  home: # the website at the bare domain: information, demo links, "Get started" requests, "Sign in to your madrasah"
    image: node:22-alpine
    restart: unless-stopped
    command: node /site/server.mjs
    env_file: { path: ./home.env, required: false } # REQUESTS_PASSWORD, made by ./madrasah home
    volumes:
      - ./home:/site:ro
      - ./sites:/sites:ro # which madrasahs exist, for "Sign in"
      - home_data:/data # requests to join
    networks: [apps]
    mem_limit: 128m
volumes:
  home_data:
  pgdata:
  caddy_data:
  caddy_config:
networks:
  apps:
    name: madrasah_apps
